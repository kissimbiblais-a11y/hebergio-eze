name = "hebergio"
main = "cloudflare/worker.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/s/*"]
not_found_handling = "single-page-application"

[vars]
FIREBASE_PROJECT_ID = "eminent-mission-mv0ns"
FEDAPAY_ENV = "sandbox"

# 1. Créez un espace KV sur votre compte Cloudflare (plan gratuit) :
#    npx wrangler kv namespace create HEBERGIO_KV
# 2. Décommentez les 3 lignes ci-dessous et collez l'ID affiché :
# [[kv_namespaces]]
# binding = "HEBERGIO_KV"
# id = "REMPLACER_PAR_VOTRE_KV_ID"
